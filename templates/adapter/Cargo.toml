# Starter for a host that styles its own tree with tpt-css. Copy this folder
# out of the repository, and change the path below to a released tpt-css.
[package]
name = "tpt-css-adapter-template"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tpt-css = { path = "../.." }
