# SPDX-License-Identifier: MIT OR Apache-2.0
# CI gates from spec.txt section 23.3.
#
# The spec trace check runs inside `cargo test` (tests/integration/spec_trace.rs).
# Fuzz smoke runs on Linux with nightly and cargo-fuzz (see the fuzz-smoke job).
# Linux-only tooling belongs here, not on a developer machine.
name: ci

on:
  push:
  pull_request:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--no-default-features", "--features web"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  doc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--no-default-features", "--features web"]
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps ${{ matrix.features }}

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: ["", "--no-default-features", "--features web"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test ${{ matrix.features }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.120
      - run: cargo test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans advisories

  unsafe-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No unsafe code outside the forbid attribute
        run: |
          if grep -rnE '\bunsafe\b' src --include='*.rs' | grep -v 'forbid(unsafe_code)'; then
            echo "unsafe found"; exit 1
          fi

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Check cargo-fuzz is available
        run: |
          command -v cargo-fuzz
          cargo-fuzz --version
          cargo +nightly --version
      - name: Run each fuzz target for 60 seconds
        run: |
          cd fuzz
          for target in tokenizer stylesheet declaration selector calc color; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the WASM playground
        working-directory: playground
        run: cargo build --release --target wasm32-unknown-unknown
