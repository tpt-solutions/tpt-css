# Weekly dependency updates. The engine core has no dependencies; these cover
# the CI actions and the fuzz harness, which is a separate package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
