# Fuzz targets for tpt-css (spec 22.3). This is a separate package with its own
# lockfile, so libfuzzer-sys is not part of the engine's dependency tree. Run it
# with cargo-fuzz on Linux; CI does this in the `fuzz-smoke` job.

[package]
name = "tpt-css-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tpt-css]
path = ".."

[[bin]]
name = "tokenizer"
path = "fuzz_targets/tokenizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stylesheet"
path = "fuzz_targets/stylesheet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "declaration"
path = "fuzz_targets/declaration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "selector"
path = "fuzz_targets/selector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "calc"
path = "fuzz_targets/calc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "color"
path = "fuzz_targets/color.rs"
test = false
doc = false
bench = false

[workspace]
